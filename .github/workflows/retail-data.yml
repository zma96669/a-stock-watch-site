name: Update retail trend data

on:
  schedule:
    - cron: '17 2 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retail-data
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh full A-share search directory
        run: node scripts/collect-stock-universe.mjs

      - name: Collect shareholder and price history
        run: node scripts/collect-retail-data.mjs

      - name: Commit refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/data/retail/index.json website/data/retail/universe.json
          git diff --cached --quiet || git commit -m "data: refresh retail trend snapshots"
          git push
